[project]
name = "curate-course"
# 課程設定檔靠這個數字知道自己寫給哪一版框架（見 coursepath.FRAMEWORK_VERSION）。
# 只有主版號有意義：改主版號＝有非改不可的變更，同一個 commit 要在
# docs/MIGRATION.md 補上那一段，否則 make audit 會叫人去看一段不存在的文件。
version = "2.0.0"
description = "從 YouTube 策展影片課程網站的框架：配額驗證、影片連結重驗、實證查核與 SEO 產出。主題由 course/ 決定"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# 建置腳本刻意只用標準庫：沒有相依就沒有供應鏈風險，
# 任何人 clone 下來不裝東西也跑得起來。
dependencies = []

[dependency-groups]
dev = ["ruff>=0.12"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".tmp", ".wrangler", "public"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "SIM", # flake8-simplify
  "RUF", # ruff 專屬（含全形標點檢查）
]
ignore = [
  "E501",    # 行長交給 formatter
  "RUF001",  # 註解與字串大量使用中文全形標點，這是刻意的
  "RUF002",
  "RUF003",
]

[tool.ruff.format]
quote-style = "double"
