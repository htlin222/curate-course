<!doctype html>
<!--
  社群預覽圖的模板。這裡不寫任何課程專屬的數字或文案：
  seo.py 的 render_og() 會把 {{...}} 換成 course.json 算好的值，寫出 dist/og.html，
  make og 再對那一份截圖。手改這個檔案裡的數字沒有意義，下次 make build 就會被蓋掉。
-->
<html{{htmlLang}}>
  <head>
    <meta charset="utf-8" />
    <title>OG image</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      html, body { width: 1200px; height: 630px; }

      body {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 64px 72px;
        font-family: "PingFang TC", "Noto Sans TC", -apple-system,
          BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #f0f6fc;
        background:
          radial-gradient(ellipse 80% 70% at 12% -10%, #388bfd33, transparent 62%),
          radial-gradient(ellipse 60% 60% at 100% 110%, #ab7df826, transparent 60%),
          #0d1117;
        -webkit-font-smoothing: antialiased;
      }

      /* 頂部品牌列 */
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 24px;
        font-weight: 600;
        letter-spacing: 0.01em;
        color: #9198a1;
      }

      .brand svg { color: #4493f8; }

      /* 中段：space-between 會把這塊撐高，靠 margin 把它與品牌列拉開 */
      .main { margin: 18px 0 6px; }

      /* 主標 */
      .title {
        font-size: 68px;
        font-weight: 700;
        line-height: 1.18;
        letter-spacing: -0.025em;
      }

      .title em {
        font-style: normal;
        color: #4493f8;
      }

      .lede {
        margin-top: 20px;
        font-size: 26px;
        line-height: 1.5;
        color: #9198a1;
      }

      /* 數據列 */
      .stats {
        display: flex;
        gap: 44px;
        margin-top: 34px;
      }

      .stat b {
        display: block;
        font-size: 40px;
        font-weight: 700;
        line-height: 1.1;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      .stat span {
        font-size: 18px;
        color: #9198a1;
      }

      /* 底部實證列 */
      .foot {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        padding-top: 28px;
        border-top: 1px solid #3d444d;
      }

      .grades { display: flex; flex-direction: column; gap: 14px; }

      .grades-label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 19px;
        color: #9198a1;
      }

      .grades-label svg { color: #ab7df8; }

      .chips { display: flex; gap: 10px; }

      .chip {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 7px 16px;
        font-size: 19px;
        font-weight: 600;
        border-radius: 999px;
        border: 1px solid;
      }

      .chip i {
        font-style: normal;
        font-variant-numeric: tabular-nums;
        opacity: 0.75;
      }

      /* 分級用的是設定檔裡的 tone，不是分級 id：換主題改了 grades[].id
         也不用回來改 CSS。tone 的列舉見 course.schema.json 的 $defs.labelled。 */
      .t-danger    { color: #f85149; background: #f8514926; border-color: #f8514966; }
      .t-attention { color: #d29922; background: #bb800926; border-color: #d2992266; }
      .t-accent    { color: #4493f8; background: #388bfd1a; border-color: #4493f866; }
      .t-success   { color: #3fb950; background: #23863633; border-color: #3fb95066; }
      .t-done      { color: #ab7df8; background: #ab7df826; border-color: #ab7df866; }
      .t-neutral   { color: #9198a1; background: #9198a11a; border-color: #9198a166; }

      .url {
        font-size: 21px;
        font-weight: 600;
        color: #6e7681;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="brand">{{brandIcon}}{{brandName}}</div>

    <div class="main">
      <h1 class="title">{{title}}</h1>
      <p class="lede">{{lede}}</p>

      <div class="stats">{{stats}}</div>
    </div>

    <div class="foot">
      <div class="grades">
        <div class="grades-label">{{evidenceIcon}}{{evidenceLabel}}</div>
        <div class="chips">{{chips}}</div>
      </div>

      <div class="url">{{url}}</div>
    </div>
  </body>
</html>
