<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>OG image</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      html, body { width: 1200px; height: 630px; }

      body {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 64px 72px;
        font-family: "PingFang TC", "Noto Sans TC", -apple-system,
          BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #f0f6fc;
        background:
          radial-gradient(ellipse 80% 70% at 12% -10%, #388bfd33, transparent 62%),
          radial-gradient(ellipse 60% 60% at 100% 110%, #ab7df826, transparent 60%),
          #0d1117;
        -webkit-font-smoothing: antialiased;
      }

      /* 頂部品牌列 */
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 24px;
        font-weight: 600;
        letter-spacing: 0.01em;
        color: #9198a1;
      }

      .brand svg { color: #4493f8; }

      /* 中段：space-between 會把這塊撐高，靠 margin 把它與品牌列拉開 */
      .main { margin: 18px 0 6px; }

      /* 主標 */
      .title {
        font-size: 68px;
        font-weight: 700;
        line-height: 1.18;
        letter-spacing: -0.025em;
      }

      .title em {
        font-style: normal;
        color: #4493f8;
      }

      .lede {
        margin-top: 20px;
        font-size: 26px;
        line-height: 1.5;
        color: #9198a1;
      }

      /* 數據列 */
      .stats {
        display: flex;
        gap: 44px;
        margin-top: 34px;
      }

      .stat b {
        display: block;
        font-size: 40px;
        font-weight: 700;
        line-height: 1.1;
        font-variant-numeric: tabular-nums;
      }

      .stat span {
        font-size: 18px;
        color: #9198a1;
      }

      /* 底部實證列 */
      .foot {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        padding-top: 28px;
        border-top: 1px solid #3d444d;
      }

      .grades { display: flex; flex-direction: column; gap: 14px; }

      .grades-label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 19px;
        color: #9198a1;
      }

      .grades-label svg { color: #ab7df8; }

      .chips { display: flex; gap: 10px; }

      .chip {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 7px 16px;
        font-size: 19px;
        font-weight: 600;
        border-radius: 999px;
        border: 1px solid;
      }

      .chip i {
        font-style: normal;
        font-variant-numeric: tabular-nums;
        opacity: 0.75;
      }

      .c-contested { color: #f85149; background: #f8514926; border-color: #f8514966; }
      .c-limited   { color: #d29922; background: #bb800926; border-color: #d2992266; }
      .c-moderate  { color: #4493f8; background: #388bfd1a; border-color: #4493f866; }
      .c-strong    { color: #3fb950; background: #23863633; border-color: #3fb95066; }

      .url {
        font-size: 21px;
        font-weight: 600;
        color: #6e7681;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2" />
      </svg>
      體態矯正課程
    </div>

    <div class="main">
      <h1 class="title">從頭到腳，<br />把體態拆解成<em>可以練的東西</em></h1>
      <p class="lede">頸椎到足踝 24 個體態問題，每個都告訴你怎麼自測、該練什麼，<br />以及這套說法在醫學文獻裡站不站得住腳。</p>

      <div class="stats">
        <div class="stat"><b>371</b><span>個單元</span></div>
        <div class="stat"><b>26 小時</b><span>影片總時長</span></div>
        <div class="stat"><b>24</b><span>個體態問題</span></div>
        <div class="stat"><b>27</b><span>題實證查核</span></div>
      </div>
    </div>

    <div class="foot">
      <div class="grades">
        <div class="grades-label">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 18h8M3 22h18M14 22a7 7 0 1 0 0-14h-1M9 14h2" />
            <path d="M9 12a2 2 0 0 1-2-2V6h6v4a2 2 0 0 1-2 2Z" />
            <path d="M12 6V3a1 1 0 0 0-1-1H9a1 1 0 0 0-1 1v3" />
          </svg>
          全部經 OpenEvidence 查證，結果照實寫
        </div>
        <div class="chips">
          <span class="chip c-contested">證據互斥 <i>9</i></span>
          <span class="chip c-limited">證據有限 <i>8</i></span>
          <span class="chip c-moderate">證據中等 <i>8</i></span>
          <span class="chip c-strong">證據充分 <i>2</i></span>
        </div>
      </div>

      <div class="url">body-course.pages.dev</div>
    </div>
  </body>
</html>
